server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths (/login, /dashboard, ...) load index.html and React routes them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Built JS/CSS have hashed names, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
